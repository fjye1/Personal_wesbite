name: Update Last Commit Date

on:
  push:
    branches:
      - main  # replace with your default branch if different

jobs:
  update-date:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get last commit date
        id: lastdate
        run: |
          # Get last commit date in YYYY-MM-DD format
          LAST_DATE=$(git log -1 --format=%cd --date=short)
          echo "LAST_DATE=$LAST_DATE" >> $GITHUB_ENV

      - name: Replace placeholder in HTML
        run: |
          # Replace placeholder YYYY-MM-DD with last commit date in index.html
          sed -i "s/YYYY-MM-DD/$LAST_DATE/" index.html

      - name: Commit updated HTML
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          # Only commit if there’s a change to prevent empty commits
          git diff-index --quiet HEAD || git commit -m "Update last updated date"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main