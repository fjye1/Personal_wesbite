name: Update Last Commit Date & Sitemap

on:
  push:
    branches:
      - main  # replace with your default branch if different

jobs:
  update-date-and-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get last commit date
        id: lastdate
        run: |
          # Get last commit date in YYYY-MM-DD format
          LAST_DATE=$(git log -1 --format=%cd --date=short)
          echo "LAST_DATE=$LAST_DATE" >> $GITHUB_ENV

      - name: Replace last-updated placeholder in footer
        run: |
          sed -i "s|<span id=\"last-updated\">.*</span>|<span id=\"last-updated\">$LAST_DATE</span>|" footer.html

      - name: Generate sitemap.xml with last commit date
        run: |
          python3 -c "
          content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">
            <url>
              <loc>https://frederickelledge.cloud/</loc>
              <lastmod>$LAST_DATE</lastmod>
              <priority>1.0</priority>
            </url>
            <url>
              <loc>https://frederickelledge.cloud/about.html</loc>
              <lastmod>$LAST_DATE</lastmod>
              <priority>0.8</priority>
            </url>
            <url>
              <loc>https://frederickelledge.cloud/projects.html</loc>
              <lastmod>$LAST_DATE</lastmod>
              <priority>0.9</priority>
            </url>
            <url>
              <loc>https://frederickelledge.cloud/certificates.html</loc>
              <lastmod>$LAST_DATE</lastmod>
              <priority>0.7</priority>
            </url>
            <url>
              <loc>https://frederickelledge.cloud/contact.html</loc>
              <lastmod>$LAST_DATE</lastmod>
              <priority>0.6</priority>
            </url>
          </urlset>'''
          open('sitemap.xml', 'w').write(content)
                  "

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add footer.html sitemap.xml
          # Only commit if there’s a change
          git diff-index --quiet HEAD || git commit -m "Update last updated date and sitemap"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main